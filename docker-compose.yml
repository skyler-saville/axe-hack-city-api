version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axe-hack-city-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://axehack:axehack@postgres:5432/axe_hack_city
      ENVIRONMENT: docker
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: axe-hack-city-assets
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: axe-hack-city-postgres
    environment:
      POSTGRES_DB: axe_hack_city
      POSTGRES_USER: axehack
      POSTGRES_PASSWORD: axehack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axehack -d axe_hack_city"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: axe-hack-city-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: axe-hack-city-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing local/axe-hack-city-assets;
      /usr/bin/mc anonymous set download local/axe-hack-city-assets;
      exit 0;
      "
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: axe-hack-city-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: axe-hack-city-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@axehackcity.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - admin
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
