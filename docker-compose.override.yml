version: "3.9"

services:
  api:
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./:/app
    command: uvicorn axe_hack_city.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  pgadmin:
    ports:
      - "${PGADMIN_PORT:-5050}:80"
