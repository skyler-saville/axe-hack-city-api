name: Smoke Tests

on:
  push:
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: '1.8.3'

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Run smoke tests
        run: poetry run pytest tests/test_smoke_game_core.py tests/test_gameplay_module.py -q
